{% extends "base.html" %}
{% load static %}

{% block title %}Login{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'accounts/auth.css' %}">
{% endblock %}

{% block content %}

<div class="auth">

    <div class="auth__card">

        <h1 class="auth__title">
            Login
        </h1>


        <form method="POST" class="auth__form">

            {% csrf_token %}

            <p>
                <label>Username</label>
                {{ form.username }}
            </p>


            <p>
                <label>Password</label>
                {{ form.password }}
            </p>


            <button class="button button--primary" type="submit">
                Login
            </button>

        </form>


        <p class="auth__text">
            Don't have an account?
            <a href="{% url 'signup' %}">
                Sign up
            </a>
        </p>

    </div>

</div>

{% endblock %}
