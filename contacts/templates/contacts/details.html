{% extends "base.html" %}

{% block heading %}{{ contact.name }}{% endblock %}

{% block content %}

<a href="{% url 'read' %}" class="btn btn-back">← Back</a>

<div style="margin-top: 15px;">

    <p><strong>Name:</strong> {{ contact.name }}</p>
    <p><strong>Email:</strong> {{ contact.email }}</p>
    <p><strong>Phone:</strong> {{ contact.phone }}</p>
    <p><strong>Organisation:</strong> {{ contact.organisation }}</p>
    <p><strong>Status:</strong> {{ contact.status }}</p>

</div>

<div class="actions" style="margin-top: 20px;">
    <a href="{% url 'edit' contact.id %}" class="btn">Edit</a>
    <a href="{% url 'delete' contact.id %}" class="btn btn-danger">Delete</a>
</div>

{% endblock %}
